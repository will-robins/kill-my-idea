<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'sha256-pWjQv0/F9W/iU5TzOX0ur9a9YkvuoWRfEyi0xqLSUdQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>kill-my-idea report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Design system: ui-ux-pro-max "Data-Dense Dashboard" (financial analytics) — blue data, slate neutrals, Fira Sans / Fira Code */
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#E9EEF6; --muted-fg:#475569; --border:#DBEAFE; --line:#E2E8F0;
  --primary:#1E40AF; --secondary:#3B82F6; --on-primary:#FFFFFF;
  --go:#15803D; --go-bg:#DCFCE7; --go-fill:#22C55E; --pivot:#C2410C; --pivot-bg:#FFEDD5; --pivot-fill:#F59E0B; --nogo:#DC2626; --nogo-bg:#FEE2E2; --nogo-fill:#EF4444;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12);
  --radius:14px; --sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1220; --card:#111A2E; --fg:#E2E8F0; --muted:#1A2540; --muted-fg:#94A3B8; --border:#1E2B47; --line:#1E293B;
  --primary:#60A5FA; --secondary:#93C5FD; --on-primary:#0B1220;
  --go:#4ADE80; --go-bg:#052E1A; --go-fill:#22C55E; --pivot:#FBBF24; --pivot-bg:#2A1A06; --pivot-fill:#F59E0B; --nogo:#F87171; --nogo-bg:#3A0D0D; --nogo-fill:#EF4444;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html{scroll-padding-top:120px;scrollbar-color:var(--line) var(--bg);caret-color:var(--primary)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--primary);color:var(--on-primary)}
a{color:var(--primary);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--secondary);outline-offset:2px;border-radius:6px}
button{font:inherit;cursor:pointer}
.num,table td{font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-weight:500}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px}

/* top bar + section tabs */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar{max-width:1200px;margin:0 auto;padding:12px var(--s3);display:flex;align-items:center;gap:var(--s2)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--fg);text-decoration:none;white-space:nowrap}
.brand svg{width:28px;height:28px}
.topbar .t{flex:1;min-width:0;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);padding:5px 10px;border-radius:999px;white-space:nowrap}
.b-GO{color:var(--go);background:var(--go-bg)} .b-PIVOT{color:var(--pivot);background:var(--pivot-bg)} .b-NO-GO{color:var(--nogo);background:var(--nogo-bg)}
.b-doable{color:var(--go);background:var(--go-bg)} .b-hard{color:var(--pivot);background:var(--pivot-bg)} .b-very-hard{color:var(--nogo);background:var(--nogo-bg)}
.b-neutral{color:var(--muted-fg);background:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-weight:500;transition:background .2s,border-color .2s}
.btn:hover{background:var(--muted);border-color:var(--secondary)}
.tabs{max-width:1200px;margin:0 auto;padding:0 var(--s3);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:10px 12px;color:var(--muted-fg);text-decoration:none;font-size:14px;font-weight:500;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tabs a:hover{color:var(--fg)} .tabs a.on{color:var(--primary);border-bottom-color:var(--primary)}

/* layout */
main{max-width:1200px;margin:0 auto;padding:var(--s4) var(--s3) var(--s6)}
.grid{display:grid;gap:var(--s3);align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--s3);min-width:0}
section{margin-top:var(--s5)}
.sh{margin-bottom:var(--s2)}
h1{font:700 clamp(30px,4vw,46px)/1.12 var(--sans);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
h2{font:600 24px/1.25 var(--sans);letter-spacing:-.01em;margin:0}
h3{font:600 17px/1.35 var(--sans);margin:0 0 12px}
.sub{color:var(--muted-fg);margin:4px 0 0;max-width:70ch}
p{max-width:72ch}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s4);align-items:center;padding:var(--s4)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s2)}
.pitch{color:var(--muted-fg);font-size:18px;margin:0 0 var(--s3)}
.answer{font-size:19px;line-height:1.55;margin:0}
.score{display:grid;justify-items:center;gap:12px}
.ring{width:min(100%,240px);aspect-ratio:1}
.ring text{font-family:var(--mono)}
.verdict{display:inline-flex;align-items:center;gap:8px;font:700 20px var(--sans);letter-spacing:.02em;padding:8px 18px;border-radius:12px}
.verdict .ic{width:20px;height:20px}

/* KPI cards */
.kpi .k{display:flex;align-items:center;gap:8px;color:var(--muted-fg);font-size:14px;font-weight:500}
.kpi .v{font:600 30px/1.15 var(--mono);margin:10px 0 6px;letter-spacing:-.02em}
.kpi .v .u,.num .u{font:400 13px var(--sans);color:var(--muted-fg);margin-left:2px}
.kpi .m{font-size:14px;color:var(--muted-fg)}
.kpi .m.bad{color:var(--nogo)} .kpi .m.ok{color:var(--pivot)} .kpi .m.good{color:var(--go)}
.ev{display:inline-flex;align-items:center;gap:3px;font:500 11px var(--sans);color:var(--muted-fg);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:3px;cursor:help;white-space:nowrap}
.ev.s{color:var(--primary);border-color:var(--border)}
.ev .ic{width:11px;height:11px;vertical-align:0}
.unk{color:var(--muted-fg);font-style:italic}
.kw{font-weight:600;color:var(--fg);background:linear-gradient(transparent 58%,color-mix(in srgb,var(--secondary) 24%,transparent) 58%);padding:0 2px;border-radius:2px}
sup.fn a{font:600 11px var(--mono);text-decoration:none;margin-left:2px}

.tldr{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tldr li{display:flex;gap:10px;align-items:flex-start}
.tldr li .ic{color:var(--primary);margin-top:4px}
.lesson{margin:var(--s2) 0 0;padding:14px 16px;background:var(--muted);border-radius:10px;max-width:none}

/* rescue */
.rx{display:flex;flex-direction:column;gap:14px;transition:transform .2s,border-color .2s}
.rx:hover{transform:translateY(-2px);border-color:var(--secondary)}
.rx .ch{font-weight:600;font-size:17px;line-height:1.4}
.rx .why{color:var(--muted-fg);font-size:14px}
.delta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.track{position:relative;height:8px;background:var(--muted);border-radius:99px;overflow:hidden}
.track span{position:absolute;top:0;bottom:0;left:0;border-radius:99px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.facts dt{color:var(--muted-fg)} .facts dd{margin:0}

/* kill shots */
.ks{list-style:none;margin:0;padding:0}
.ks li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.ks li:last-child{border-bottom:0}
.dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.ks .t{font-weight:600} .ks .e{color:var(--muted-fg);font-size:14px;margin-top:2px}

/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:600 13px var(--sans);color:var(--muted-fg);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{transition:background .15s} tbody tr:hover{background:var(--bg)}
td.r,th.r{text-align:right}
.hl{background:color-mix(in srgb,var(--go-bg) 55%,transparent)}

/* charts */
.chart{margin:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart figcaption{font-size:13px;color:var(--muted-fg);margin-top:10px}
.ax{font:400 12px var(--mono);fill:var(--muted-fg)}
.lb{font:500 15px var(--sans);fill:var(--fg)}
.lv{font:500 14px var(--mono);fill:var(--fg)}
.gridl{stroke:var(--line)}
.hit{cursor:pointer}
.hit:hover .mk,.hit:focus .mk{stroke:var(--secondary);stroke-width:3}
#tip{position:fixed;z-index:50;pointer-events:none;max-width:300px;background:var(--fg);color:var(--bg);font:400 13px/1.45 var(--sans);padding:10px 12px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:opacity .15s}
#tip b{display:block;font-weight:600;margin-bottom:2px}
#tip{white-space:pre-line}

.quote{margin:0;font-size:16px;line-height:1.55}
.quote cite{display:block;font-style:normal;font-size:13px;color:var(--muted-fg);margin-top:8px}


/* key findings + recommendation */
.kf{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}
.kf-n{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--muted);color:var(--primary);font:600 15px var(--mono)}
.kf h3{margin:4px 0 6px} .kf p{margin:0;color:var(--muted-fg);font-size:15px}
.reco{border-color:var(--border);background:linear-gradient(0deg,var(--card),var(--card)) padding-box,linear-gradient(90deg,var(--primary),var(--secondary)) border-box;border:1px solid transparent}
.reco-k{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--primary);font-size:14px;text-transform:none}
.reco p{font-size:18px;margin:8px 0 12px;max-width:none}
/* granular scoring */
.crit-h,.crit summary,.crit.flat{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 70px 110px 18px;gap:16px;align-items:center}
.crit-h{font:600 13px var(--sans);color:var(--muted-fg);padding:0 0 10px;border-bottom:1px solid var(--line)} .crit-h span:nth-child(3),.crit-h span:nth-child(4){text-align:right}
.crit{border-bottom:1px solid var(--line)} .crit summary{list-style:none;cursor:pointer;padding:14px 0;border-radius:8px;transition:background .15s} .crit summary::-webkit-details-marker{display:none}
.crit summary:hover{background:var(--bg)} .crit summary .ic{transition:transform .2s;color:var(--muted-fg)} .crit[open] summary .ic{transform:rotate(90deg)}
.crit.flat{padding:14px 0}
.cn{font-weight:600;display:flex;flex-direction:column} .cw{font:400 12px var(--sans);color:var(--muted-fg)}
.cs,.cp{text-align:right}
.sbar{display:block;height:10px;background:var(--muted);border-radius:99px;overflow:hidden} .sbar .bar{display:block;height:100%;border-radius:99px}
.subs{list-style:none;margin:0 0 14px;padding:12px 14px;background:var(--bg);border-radius:10px;display:grid;gap:10px}
.subs li{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:4px 14px;align-items:center;font-size:14px}
.subs .sn{font-weight:500} .subs .snote{grid-column:1/-1;color:var(--muted-fg);font-size:13px}
.crit-t{display:flex;justify-content:space-between;padding:14px 0 4px;font-weight:600;font-size:17px}
.note{font-size:13px;color:var(--muted-fg);margin:10px 0 0;max-width:none}
@media (max-width:768px){.crit-h{display:none}.crit summary,.crit.flat{grid-template-columns:minmax(0,1fr) 60px 18px;row-gap:8px}.crit summary .sbar,.crit.flat .sbar{grid-column:1/-1;grid-row:2}.cp{display:none}.subs li{grid-template-columns:110px minmax(0,1fr) 36px}}
@media print{.crit summary .ic{display:none}}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px 20px minmax(0,1fr);gap:12px;padding-bottom:18px}
.tl .w{font:600 13px var(--mono);color:var(--primary);padding-top:2px;text-align:right}
.tl .node{position:relative;display:flex;justify-content:center}
.tl .node::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--primary);margin-top:5px;z-index:1}
.tl li:not(:last-child) .node::after{content:"";position:absolute;top:18px;bottom:-22px;width:2px;background:var(--border)}
.tl .vf{color:var(--muted-fg);font-size:14px;margin-top:2px}
.stop{border:1px solid color-mix(in srgb,var(--nogo) 35%,transparent);background:var(--nogo-bg);border-radius:12px;padding:14px 16px}
.stop h3{color:var(--nogo);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.stop ul{margin:0;padding-left:20px}

ol.src{margin:0;padding-left:26px;font-size:14px;columns:2;column-gap:var(--s4)}
ol.src li{padding:4px 0;break-inside:avoid;color:var(--muted-fg)} ol.src li::marker{font:600 12px var(--mono);color:var(--primary)}
ol.src li:target{background:var(--pivot-bg);border-radius:6px}
footer{max-width:1200px;margin:0 auto;padding:0 var(--s3) var(--s5);color:var(--muted-fg);font-size:13px}
.err{max-width:560px;margin:20vh auto}

/* motion (ui-ux-pro-max Stagger List: 400ms, back-out) — only when JS runs and motion is allowed */
.motion .rv{opacity:0;transform:translateY(16px) scale(.98)}
.motion .rv.in{opacity:1;transform:none;transition:opacity .4s ease-out,transform .45s cubic-bezier(.34,1.4,.64,1);transition-delay:var(--d,0ms)}
.motion .grow .bar{transform:scaleX(0);transform-box:fill-box;transform-origin:left center}
.motion .grow.in .bar{transform:scaleX(1);transition:transform .8s cubic-bezier(.22,1,.36,1) .15s}
.motion .verdict{opacity:0;transform:scale(.6)}
.motion .verdict.in{opacity:1;transform:none;transition:opacity .2s,transform .45s cubic-bezier(.34,1.56,.64,1)}

/* responsive: 375 / 768 / 1024 / 1440 */
@media (max-width:1024px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))} .hero{grid-template-columns:1fr} .score{order:-1}}
@media (max-width:768px){.g2,.g3{grid-template-columns:1fr} ol.src{columns:1} .topbar .t{display:none} main{padding:var(--s3) var(--s2) var(--s5)} .topbar,.tabs{padding-left:var(--s2);padding-right:var(--s2)} .hero{padding:var(--s3)}}
@media (max-width:480px){.g4{grid-template-columns:1fr} .tl li{grid-template-columns:64px 20px minmax(0,1fr)} .ks li{grid-template-columns:28px minmax(0,1fr)} .ks li .badge{grid-column:2;justify-self:start} .btn span{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
@media print{
  @page{size:A4;margin:14mm 12mm}
  :root{--bg:#fff;--card:#fff;--shadow:none}
  body{font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,#tip{display:none} main{padding:0} .card{break-inside:avoid;box-shadow:none}
  .motion .rv,.motion .verdict{opacity:1;transform:none} .motion .grow .bar{transform:none}
  section{margin-top:var(--s3)} .hero{grid-template-columns:1.5fr 1fr} .score{order:0} a{color:inherit;text-decoration:none}
}
</style>
</head>

<div id="app"></div>
<script>
(() => {
"use strict";
const D = window.KMI_DATA, app = document.getElementById("app");
const fail = (title, detail) => { app.innerHTML = '<div class="err card"><h2></h2><p></p></div>'; app.querySelector("h2").textContent = title; app.querySelector("p").textContent = detail; };
if (!D || typeof D !== "object") { fail("Report data not found", "Keep report.html and report-data.js in the same folder, or run /kill-my-idea:kill again."); return; }
if (!D.verdict || typeof D.verdict !== "object" || !D.idea || typeof D.idea !== "object") { fail("Report data is incomplete", "report-data.js must contain idea and verdict objects (see report-data.schema.json). Run /kill-my-idea:kill again."); return; }
try {
const I = D.idea || {}, V = D.verdict || {}, N = D.narrative || {}, M = V.metrics || {};
/* security: values rendered without escaping must be numbers or known enums */
const num = v => (v === null || v === undefined || v === "") ? null : (Number.isFinite(+v) ? +v : null);
V.score = num(V.score) ?? 0;
if (!["GO", "PIVOT", "NO-GO"].includes(V.verdict)) V.verdict = V.score >= 70 ? "GO" : V.score >= 50 ? "PIVOT" : "NO-GO";
if (V.criteria) for (const k in V.criteria) V.criteria[k] = num(V.criteria[k]) ?? 0;
const LMH = v => ["L", "M", "H"].includes(v) ? v : "M";
(N.rescue || []).forEach(r => { r.score_after = num(r.score_after) ?? 0; if (!["doable", "hard", "very-hard"].includes(r.difficulty)) r.difficulty = "hard"; });
(N.competitors || []).forEach(c => { c.traction = num(c.traction); c.price_low = num(c.price_low); c.price_high = num(c.price_high); });
(N.scenarios || []).forEach(sc => { ["customers_month", "revenue_month", "costs_month"].forEach(k => { sc[k] = num(sc[k]); }); });
(N.risks || []).forEach(r => { r.likelihood = LMH(r.likelihood); r.impact = LMH(r.impact); });
if (I.price) I.price.amount = num(I.price.amount);
/* language: UI labels follow the idea's language (en, fr) */
const LANG = String(I.language || N.language || "en").slice(0, 2).toLowerCase() === "fr" ? "fr" : "en";
const FR = {
  "Executive summary": "Synthèse", "Could it be saved?": "Peut-on la sauver ?", "How to make it stronger": "Comment la renforcer", "Next step: 7-day test": "Prochaine étape : test de 7 jours",
  "Evidence": "Preuves", "Market": "Marché", "Competition": "Concurrence", "What customers say": "Ce que disent les clients", "Unit economics": "Économie unitaire", "Countries": "Pays",
  "Risks": "Risques", "Scoring": "Notation", "Sources": "Sources", "Recommendation": "Recommandation", "Lesson:": "Leçon :", "Plan": "Plan", "Stop if": "Arrêter si",
  "LTV : CAC": "LTV : CAC", "Break-even": "Point mort", "Time to first sale": "Délai avant la 1re vente", "Competitors found": "Concurrents trouvés",
  "Healthy is 3 or more": "Sain à partir de 3", "Each paid customer loses money": "Chaque client payant fait perdre de l'argent", "Positive but fragile": "Positif mais fragile", "Healthy": "Sain",
  "Customers needed per month": "Clients nécessaires par mois", "From today": "À partir d'aujourd'hui", "Doable": "Faisable", "Hard": "Difficile", "Very hard": "Très difficile",
  "Effort": "Effort", "Cost": "Coût", "Needs": "Besoins", "Hit": "Touché", "Clear": "Écarté", "Kill shots": "Points de rupture",
  "Free alternative": "Alternative gratuite", "Strong direct competitor": "Concurrent direct solide", "Failed attempts before": "Échecs précédents", "No distribution channel": "Pas de canal de distribution",
  "Costs eat the margin": "Les coûts mangent la marge", "Weak or falling demand": "Demande faible ou en baisse", "Legal or platform risk": "Risque juridique ou de plateforme", "Saturated wave of look-alike launches": "Vague saturée de lancements similaires",
  "Fact-check of the source": "Vérification de la source", "Claim": "Affirmation", "Verdict": "Verdict", "True": "Vrai", "Partly true": "Partiellement vrai", "False": "Faux", "Not verified": "Non vérifié",
  "Who buys": "Qui achète", "Their problem": "Leur problème", "What they use today": "Ce qu'ils utilisent aujourd'hui", "Market size": "Taille du marché", "Total market": "Marché total",
